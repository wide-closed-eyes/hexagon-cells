[project]
name = "megafon-test"
version = "0.1.0"
description = "тестовое задание на работу с fastapi и h3"
authors = [
    {name = "Pavel Dushkin",email = "dushkin.p@bk.ru"}
]
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
    "h3 (>=4.5.0,<5.0.0)",
    "fastapi (>=0.143.3,<0.144.0)",
    "pydantic (>=2.14.1,<3.0.0)",
    "uvicorn (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "shapely (>=2.2.0,<3.0.0)",
    "simplekml (>=1.3.6,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
flake8 = "^7.4.1"
black = "^26.10.1"
isort = "^9.0.2"
pytest = "^9.1.1"
pre-commit = "^4.7.0"

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.git
  | \.gitignore
  | \.flake8
  | \.venv
  | dev
  | common
  | test
  | poetry\.lock
  | README\.md
  | pyproject\.toml
  | \.env
)/
'''

[tool.isort]
profile = "black"
include_trailing_comma = true
line_length = 88
skip = [".venv", "dev", "alembic", "__init__.py", "common", "test"]